name: Runtime boundary

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Test boundary scanner
        run: python -m unittest -v test_scan_forbidden_runtime_assets.py
      - name: Scan tracked source
        run: python scripts/scan_forbidden_runtime_assets.py source .
